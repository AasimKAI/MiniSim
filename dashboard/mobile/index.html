<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="__CSRF__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>MiniSim</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
body{padding-bottom:86px}
main{padding:16px 16px 0;max-width:640px;margin:0 auto}
section{margin-bottom:20px}
section>.lab{display:block;margin-bottom:9px}

/* hero */
.eq-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eq-num{font-size:clamp(30px,10.5vw,42px);font-weight:800;line-height:1;
        letter-spacing:-1.6px;font-variant-numeric:tabular-nums}
.eq-delta{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.eq-sub{color:var(--muted);font-size:11.5px;margin-top:6px;line-height:1.6}
canvas.echart{width:100%;height:118px;display:block;margin-top:12px;touch-action:pan-y}
.hero-tiles{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.hero-tiles .t-val{font-size:16px}

/* positions */
.pos-card{padding:12px;margin-bottom:8px}
.pos-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pos-name{display:flex;align-items:center;gap:8px;min-width:0}
.pos-coin{font-size:15px;font-weight:750}
.pos-pnl{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums}
.pos-detail{display:flex;justify-content:space-between;gap:8px;
            margin-top:7px;font-size:11px;color:var(--muted);
            font-variant-numeric:tabular-nums}
.pos-card .meter{margin-top:9px}
.pos-strat{font-size:9.5px;color:var(--muted);font-style:italic}

/* signals grid */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:11px;
      padding:9px 10px;cursor:pointer;min-width:0;
      transition:border-color .3s,background .2s}
.cell:active{background:var(--raised)}
.cell.sbuy{border-color:var(--up-line);box-shadow:inset 3px 0 0 -1px var(--up)}
.cell.ssell{border-color:var(--dn-line);box-shadow:inset 3px 0 0 -1px var(--dn)}
.cell.nm-hint{border-color:var(--warn-line)}
.cell.open-pos{outline:2px solid var(--acc-line);outline-offset:-2px}
.cell-row1{display:flex;justify-content:space-between;align-items:center;gap:5px}
.cell-name{font-size:12.5px;font-weight:750;display:flex;align-items:center;gap:6px;min-width:0}
.cell-price{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell-act{font-size:10px;font-weight:700;margin-top:5px;letter-spacing:.3px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-act.buy{color:var(--up)}.cell-act.sell{color:var(--dn)}.cell-act.sd{color:var(--muted)}
.cell .meter{margin-top:6px}
.cell-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cell-age{font-size:8.5px;color:var(--muted)}
.cell-age.stale{color:var(--serious)}

/* strategies */
.router-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
             padding:12px;margin-bottom:8px}
.router-reason{font-size:11px;color:var(--muted);line-height:1.5;width:100%}
.strat-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
           border-bottom:1px solid var(--line)}
.strat-row:last-child{border-bottom:none}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;background:var(--baseline)}
.sdot.on{background:var(--up);box-shadow:0 0 5px var(--up)}
.strat-name{font-size:13px;font-weight:700}
.strat-meta{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.strat-meta b{color:var(--ink2);font-weight:650}

/* performance */
.perf-top{display:flex;align-items:center;gap:16px}
canvas.donut{width:82px;height:82px;flex-shrink:0}
.perf-stats{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ps{text-align:center}
.ps-val{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.ps-lab{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.trow{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.trow:last-child{border-bottom:none}
.trow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow-left{display:flex;align-items:center;gap:8px;min-width:0}
.trow-sub{display:flex;gap:6px;font-size:10.5px;color:var(--muted);margin-top:3px;
          flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tpnl{font-weight:750;font-variant-numeric:tabular-nums}

/* health + kill */
.health{display:flex;flex-wrap:wrap;gap:6px}
.kill-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:12px 16px
          calc(12px + env(safe-area-inset-bottom));
          background:rgba(13,13,13,.92);backdrop-filter:blur(10px);
          border-top:1px solid var(--line)}
.kill-bar .btn{width:100%;padding:14px;font-size:14px;border-radius:12px}

/* bottom sheet modal */
.sheet-overlay{align-items:flex-end}
.sheet{border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;
       padding:18px 16px calc(28px + env(safe-area-inset-bottom));border-bottom:none}
.sheet-drag{width:36px;height:4px;border-radius:2px;background:var(--baseline);margin:0 auto 16px}
.m-hdr{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.m-coin{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.m-price{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.m-chg{font-size:13px;font-weight:650}
.m-int{font-size:10px;color:var(--muted);margin-left:auto}
canvas.cchart{width:100%;height:230px;display:block;touch-action:pan-y}
.m-analysts{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="name">MiniSim</span><span class="ver" id="verChip">—</span></div>
  <span class="regime" id="pregime">scanning…</span>
  <div class="spacer"></div>
  <a class="navlink" href="/macro">Macro</a>
  <a class="navlink" href="/report">Report</a>
  <span class="pulse" id="pulse"></span>
  <span class="chip num" id="clock">—</span>
</header>

<main>
  <section>
    <span class="lab">Portfolio</span>
    <div class="eq-row">
      <span class="eq-num" id="equity">—</span>
      <span class="eq-delta" id="eqdelta"></span>
    </div>
    <div class="eq-sub" id="cashline">—</div>
    <div class="eq-sub" id="stratline"></div>
    <canvas class="echart" id="echart"></canvas>
    <div class="tiles hero-tiles">
      <div class="tile"><div class="t-lab">Win rate</div><div class="t-val" id="sWR">—</div></div>
      <div class="tile"><div class="t-lab">Trades</div><div class="t-val" id="sTrades">—</div></div>
      <div class="tile"><div class="t-lab">Avg P/L</div><div class="t-val" id="sAvg">—</div></div>
      <div class="tile"><div class="t-lab">Realized</div><div class="t-val" id="sReal" style="font-size:13.5px">—</div></div>
    </div>
  </section>

  <section>
    <span class="lab">Open positions</span>
    <div id="pos"><div class="dim" style="font-size:12px">No open positions</div></div>
  </section>

  <section>
    <span class="lab">Market signals</span>
    <div class="cgrid" id="cgrid"></div>
  </section>

  <section>
    <span class="lab">Strategies</span>
    <div id="strat-section"><div class="dim" style="font-size:12px">Loading strategy state…</div></div>
  </section>

  <section>
    <span class="lab">Performance</span>
    <div class="card pad">
      <div class="perf-top">
        <canvas class="donut" id="donut"></canvas>
        <div class="perf-stats">
          <div class="ps"><div class="ps-val up" id="pWins">—</div><div class="ps-lab">Wins</div></div>
          <div class="ps"><div class="ps-val dn" id="pLosses">—</div><div class="ps-lab">Losses</div></div>
          <div class="ps"><div class="ps-val" id="pAvg">—</div><div class="ps-lab">Avg %</div></div>
          <div class="ps"><div class="ps-val" id="pReal" style="font-size:13.5px">—</div><div class="ps-lab">Realized</div></div>
        </div>
      </div>
      <hr class="hair" style="margin:12px 0 4px">
      <div id="trades"><div class="dim" style="font-size:12px;padding:6px 0">No closed trades yet</div></div>
    </div>
  </section>

  <section>
    <span class="lab">System</span>
    <div class="health" id="health"></div>
  </section>
</main>

<div class="kill-bar">
  <button class="btn danger" id="kill" onclick="toggleKill()">◉&ensp;KILL SWITCH</button>
</div>

<div class="overlay sheet-overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal sheet">
    <div class="sheet-drag"></div>
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="m-hdr">
      <span class="m-coin" id="mCoin">—</span>
      <span class="m-price" id="mPrice">—</span>
      <span class="m-chg" id="mChg"></span>
      <span class="m-int" id="mInterval">15m</span>
    </div>
    <div id="mBody"><div class="modal-loading">Loading…</div></div>
    <div class="m-analysts" id="mAnalysts"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const {fmt,fmtp,esc,fmtPrice,sigAge,isStale,regimeCls,api,analystDots,analystChips,
       coinDot,ALL_COINS,COIN_COLORS}=MS;
let killOn=false;

function renderStrategies(data){
  const el=document.getElementById('strat-section');
  const state=data.state||{},cat=data.catalogue||{};
  const active=new Set(state.active_strategies||[]);
  const perf=state.last_perf||{};
  const ms=state.last_market_state||{};
  const dir=ms.direction||state.direction||'—';
  const risk=state.risk_level!=null?state.risk_level:1.0;
  const age=state.last_run?sigAge(new Date(state.last_run*1000).toISOString()):'—';
  let html=`<div class="card router-line">
    <span class="regime ${regimeCls(dir)}">${esc(String(dir).toUpperCase())} market</span>
    <span class="chip">risk <b>×${risk}</b></span>
    <span class="chip">router ran <b>${esc(age)}</b> ago</span>
    ${state.reasoning?`<div class="router-reason">${esc(state.reasoning)}</div>`:''}
  </div><div class="card">`;
  const names=Object.keys(cat);
  names.sort((a,b)=>(active.has(b)?1:0)-(active.has(a)?1:0));
  names.forEach(name=>{
    const info=cat[name]||{},on=active.has(name),sp=perf[name]||{};
    const side=info.side||'BOTH';
    const pnlCls=sp.pnl_usd!=null?(sp.pnl_usd>=0?'up':'dn'):'dim';
    const pnl=sp.pnl_usd!=null?(sp.pnl_usd>=0?'+':'')+'$'+Number(sp.pnl_usd).toFixed(2):'—';
    html+=`<div class="strat-row">
      <div class="sdot ${on?'on':''}"></div>
      <div style="flex:1;min-width:0">
        <span class="strat-name">${esc(info.label||name)}</span>
        <span class="tag ${side}" style="margin-left:6px;vertical-align:middle">${side}</span>
        <div class="strat-meta">
          ${info.sl_pct!=null?`<span>SL <b>${(info.sl_pct*100).toFixed(1)}%</b></span>`:''}
          ${info.tp1_pct!=null?`<span>TP <b>${[info.tp1_pct,info.tp2_pct,info.tp3_pct].filter(Boolean).map(t=>(t*100).toFixed(1).replace('.0','')).join('/')}%</b></span>`:''}
          ${sp.trades?`<span><b>${sp.trades}</b> trades</span><span>WR <b>${Math.round(sp.win_rate||0)}%</b></span><span class="${pnlCls}">${pnl}</span>`
                     :'<span style="font-style:italic">no trades yet</span>'}
        </div>
      </div>
    </div>`;
  });
  if(!names.length)html+='<div class="dim" style="font-size:12px;padding:10px 12px">Router not yet initialised</div>';
  el.innerHTML=html+'</div>';
}

async function load(){
  try{
    const[sR,dR,pR,hR,prR,ssR]=await Promise.all([
      api('/api/status'),api('/api/decisions?limit=60'),
      api('/api/performance?limit=50'),api('/api/equity_history'),
      api('/api/prices'),api('/api/strategy_state')]);
    const s=await sR.json(),d=await dR.json();
    const perf=await pR.json(),hist=await hR.json();
    const prices=await prR.json();
    let stratState={};
    try{stratState=await ssR.json();renderStrategies(stratState);}catch(_){}

    const pulse=document.getElementById('pulse');
    pulse.classList.add('on');setTimeout(()=>pulse.classList.remove('on'),700);

    document.getElementById('verChip').textContent=
      'v'+String(s.version||'—').split('.')[0]+' · '+String(s.mode||'—').toUpperCase();
    document.getElementById('clock').textContent=
      new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const rg=document.getElementById('pregime');
    rg.textContent=(s.regime&&s.regime!=='—'?s.regime:'scanning…')+' regime';
    rg.className='regime '+regimeCls(s.regime);

    document.getElementById('equity').textContent='$'+fmt(s.equity_usd);
    const startEq=hist.length?hist[0].equity:null;
    const delta=startEq!=null&&s.equity_usd!=null?s.equity_usd-startEq:0;
    const ed=document.getElementById('eqdelta');
    if(delta){ed.textContent=(delta>=0?'+':'−')+'$'+fmt(Math.abs(delta))+' ('+fmtp(delta/startEq*100)+')';
      ed.className='eq-delta '+(delta>=0?'up':'dn');}else ed.textContent='';
    document.getElementById('cashline').textContent=
      `Cash $${fmt(s.cash_usd)} · ${s.open_positions||0} open · cycle ${s.last_cycle||'—'} · up ${s.uptime||'—'}`;
    MS.drawEquity(document.getElementById('echart'),hist);

    /* macro strip */
    try{
      const md=await(await api('/api/macro')).json();
      const fng=md.fear_greed||{},fv=fng.value??50;
      const af=md.avg_funding_pct??0,dom=(md.dominance||{}).btc_dominance??0;
      const vix=((md.tradfi||{}).vix||{}).price??0;
      const active=(stratState.state||{}).active_strategies||[];
      document.getElementById('stratline').innerHTML=
        (active.length?`Active: <b style="color:var(--ink2)">${esc(active.join(', '))}</b> · `:'')+
        `F&G <b style="color:${MS.fngColor(fv)}">${fv}</b> · fund <b style="color:var(--ink2)">${af>=0?'+':''}${af.toFixed(4)}%</b>`+
        (dom?` · BTC dom <b style="color:var(--ink2)">${dom.toFixed(1)}%</b>`:'')+
        (vix?` · VIX <b style="color:var(--ink2)">${vix.toFixed(1)}</b>`:'');
    }catch(_){}

    const wr=perf.trades?(perf.win_rate||0):null;
    document.getElementById('sWR').innerHTML=wr!=null?`<span class="${wr>=50?'up':'dn'}">${wr}%</span>`:'—';
    document.getElementById('sTrades').textContent=perf.trades||0;
    document.getElementById('sAvg').innerHTML=`<span class="${(perf.avg_pnl_pct||0)>=0?'up':'dn'}">${fmtp(perf.avg_pnl_pct)}</span>`;
    document.getElementById('sReal').innerHTML=`<span class="${(perf.realized_usd||0)>=0?'up':'dn'}">${(perf.realized_usd||0)>=0?'+':'−'}$${fmt(Math.abs(perf.realized_usd||0))}</span>`;

    /* positions */
    const pos=s.positions||[];
    document.getElementById('pos').innerHTML=!pos.length
      ?'<div class="dim" style="font-size:12px">No open positions</div>'
      :pos.map(p=>{
        const c=p.unrealised_pnl_pct>=0?'up':'dn';
        const side=p.side||'LONG';
        const barW=Math.min(Math.abs(p.unrealised_pnl_pct||0)*6,100);
        return`<div class="card pos-card">
          <div class="pos-top">
            <div class="pos-name">${coinDot(p.coin,24)}
              <span class="pos-coin">${esc(p.coin)}</span>
              <span class="tag ${side}">${side}</span>
              ${p.strat_name?`<span class="pos-strat">${esc(p.strat_name)}</span>`:''}
            </div>
            <span class="pos-pnl ${c}">${fmtp(p.unrealised_pnl_pct)}</span>
          </div>
          <div class="pos-detail">
            <span>Qty ${fmt(p.quantity)}</span>
            <span>Entry ${fmtPrice(p.entry_price)}</span>
            <span>Now ${fmtPrice(p.current_price)}</span>
          </div>
          <div class="meter"><i class="${c==='up'?'buy':'sell'}" style="width:${barW}%"></i></div>
        </div>`;}).join('');

    /* signals grid */
    const sigs={};d.forEach(dec=>{if(!sigs[dec.coin])sigs[dec.coin]=dec;});
    window._lastSigs=sigs;
    const openCoins=new Set(pos.map(p=>p.coin));
    const nmCoins=new Set();
    d.forEach(dec=>{if(dec.action==='STAND_DOWN'&&(dec.confidence||0)>=0.45&&
      (Date.now()-new Date(dec.timestamp).getTime())<720000)nmCoins.add(dec.coin);});
    const cg=document.getElementById('cgrid');cg.innerHTML='';
    [...new Set([...ALL_COINS,...Object.keys(sigs)])].slice(0,15).forEach((coin,i)=>{
      const sig=sigs[coin]||{};
      const act=sig.action||'STAND_DOWN';
      const label=act.replace('ENTRY_','').replace('_',' ');
      const conf=Math.round((sig.confidence||0)*100);
      const cls=act.includes('BUY')?'buy':act.includes('SELL')?'sell':'sd';
      const sigCls=act.includes('BUY')?'sbuy':act.includes('SELL')?'ssell':'';
      const nmCls=(cls==='sd'&&nmCoins.has(coin))?'nm-hint':'';
      const age=sig.timestamp?sigAge(sig.timestamp):'';
      cg.innerHTML+=`<div class="cell ${sigCls} ${nmCls} ${openCoins.has(coin)?'open-pos':''}"
          onclick="openModal('${esc(coin)}')">
        <div class="cell-row1">
          <span class="cell-name">${coinDot(coin,20)}${esc(coin)}</span>
          <span class="cell-price">${fmtPrice(prices[coin]??null)}</span>
        </div>
        <div class="cell-act ${cls}">${esc(label)}${conf?' · '+conf+'%':''}${nmCls?' · near miss':''}</div>
        <div class="meter"><i class="${cls}" style="width:${conf}%"></i></div>
        <div class="cell-bottom">
          <div class="adots">${analystDots(sig.analysts)}</div>
          ${age?`<span class="cell-age${isStale(sig.timestamp)?' stale':''}">${esc(age)}</span>`:''}
        </div>
      </div>`;});

    /* performance */
    MS.drawDonut(document.getElementById('donut'),perf.wins||0,perf.trades||0);
    document.getElementById('pWins').textContent=perf.wins||0;
    document.getElementById('pLosses').textContent=perf.losses||0;
    document.getElementById('pAvg').innerHTML=`<span class="${(perf.avg_pnl_pct||0)>=0?'up':'dn'}">${fmtp(perf.avg_pnl_pct)}</span>`;
    document.getElementById('pReal').innerHTML=`<span class="${(perf.realized_usd||0)>=0?'up':'dn'}">${(perf.realized_usd||0)>=0?'+':'−'}$${fmt(Math.abs(perf.realized_usd||0))}</span>`;

    const recent=perf.recent||[];
    document.getElementById('trades').innerHTML=!recent.length
      ?'<div class="dim" style="font-size:12px;padding:6px 0">No closed trades yet</div>'
      :recent.map(t=>{
        const side=(t.direction||'long').toUpperCase();
        const c=t.pnl_pct>=0?'up':'dn';
        const dt=t.buy_ts?new Date(t.buy_ts).toLocaleDateString([],{month:'short',day:'numeric'})
          +' '+new Date(t.buy_ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
        return`<div class="trow">
          <div class="trow-top">
            <div class="trow-left"><span class="tag ${side}">${side}</span>
              <b>${esc(t.coin)}</b>
              ${t.strategy?`<span class="pos-strat">${esc(t.strategy)}</span>`:''}
            </div>
            <span class="tpnl ${c}">${fmtp(t.pnl_pct)}</span>
          </div>
          <div class="trow-sub">
            <span>${esc(dt)}</span><span>·</span>
            <span>${fmtPrice(t.open_price)} → ${fmtPrice(t.close_price)}</span>
            <span>·</span><span>qty ${fmt(t.qty)}</span>
          </div>
        </div>`;}).join('');

    /* system */
    const mok=s.mcp_transport==='mcp',lok=s.llm_model_present!==false;
    const dok=String(s.data_source||'').startsWith('binance')||String(s.data_source||'').startsWith('coingecko');
    document.getElementById('health').innerHTML=
      `<span class="chip"><b class="${mok?'up':'dn'}">●</b> MCP <b>${esc(s.mcp_transport||'?')}</b></span>
       <span class="chip"><b class="${lok?'up':'dn'}">●</b> LLM <b>${esc(s.llm_backend||'?')}</b></span>
       <span class="chip"><b class="${dok?'up':'warn'}">●</b> data <b>${esc(s.data_source||'—')}</b></span>
       <span class="chip">uptime <b>${esc(s.uptime||'—')}</b></span>
       <span class="chip">v<b>${esc(s.version||'—')}</b></span>`;

    killOn=!!s.kill_switch;
    const k=document.getElementById('kill');
    k.className='btn '+(killOn?'safe':'danger');
    k.innerHTML=killOn?'◉&ensp;RESUME ENTRIES':'◉&ensp;KILL SWITCH';
  }catch(e){document.getElementById('clock').textContent='offline';}
}

async function toggleKill(){
  if(!killOn&&!confirm('Pause new entries? (protective exits keep running)'))return;
  await api(killOn?'/api/resume':'/api/kill',{method:'POST'});load();
}

async function openModal(coin){
  const sig=(window._lastSigs||{})[coin]||{};
  document.getElementById('overlay').classList.add('open');
  document.getElementById('mCoin').innerHTML=`${coinDot(coin,26)}${esc(coin)}`;
  document.getElementById('mPrice').textContent='—';
  document.getElementById('mChg').textContent='';
  document.getElementById('mInterval').textContent='15m · loading…';
  document.getElementById('mBody').innerHTML='<div class="modal-loading">Loading chart…</div>';
  document.getElementById('mAnalysts').innerHTML=analystChips(sig.analysts);
  try{
    const data=await(await api(`/api/candles?coin=${encodeURIComponent(coin)}&limit=60`)).json();
    const cs=data.candles||[];
    if(cs.length){
      const last=cs[cs.length-1][3],first=cs[0][3];
      const chg=((last-first)/first)*100;
      document.getElementById('mPrice').textContent='$'+fmt(last);
      const mc=document.getElementById('mChg');
      mc.textContent=fmtp(chg);mc.className='m-chg '+(chg>=0?'up':'dn');
      document.getElementById('mInterval').textContent=`${data.interval} · ${cs.length} candles`;
      document.getElementById('mBody').innerHTML='<canvas class="cchart" id="cchart"></canvas>';
      MS.drawCandles(document.getElementById('cchart'),cs);
    }else{document.getElementById('mBody').innerHTML='<div class="modal-loading">No chart data</div>';}
  }catch(e){document.getElementById('mBody').innerHTML='<div class="modal-loading">Failed to load chart</div>';}
}
function closeModal(){document.getElementById('overlay').classList.remove('open');MS.hideTip();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

load();setInterval(load,8000);
</script>
