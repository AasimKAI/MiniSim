<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MiniSim{% endblock %} · MiniSim</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <nav class="topnav">
    <span class="brand">MiniSim</span>
    <a href="/live" {% if request.url.path == '/live' %}class="active"{% endif %}>Live</a>
    <a href="/backtest" {% if request.url.path.startswith('/backtest') %}class="active"{% endif %}>Backtest</a>
    <a href="/decisions" {% if request.url.path == '/decisions' %}class="active"{% endif %}>Decisions</a>
    <a href="/tax" {% if request.url.path == '/tax' %}class="active"{% endif %}>Tax</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
