<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="csrf-token" content="__CSRF__">
<title>MiniSim</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
html,body{height:100%;overflow:hidden}
body{height:100vh;display:flex;flex-direction:column;padding:8px 8px 8px}

/* header */
.hd{display:flex;align-items:center;gap:6px;height:34px;flex-shrink:0;margin-bottom:6px}
.hd .brand .name{font-size:15px}
.cycle-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cycle-lbl{font-size:9px;color:var(--muted);white-space:nowrap}
canvas.cycle-arc{display:block;flex-shrink:0;width:24px;height:24px}
.wbtn{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;font-size:12px;
      line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wbtn:hover{opacity:.75}
.wbtn.wmin{background:var(--warn);color:#000}
.wbtn.wcls{background:var(--dn);color:#fff}
.split-btn{font-size:10px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);
           background:var(--surface2);color:var(--muted);cursor:pointer;font-weight:700;
           letter-spacing:.4px;font-family:inherit}
.split-btn.on{background:var(--acc-wash);color:var(--acc);border-color:var(--acc-line)}
.chip{padding:3px 8px;font-size:10px}
.navlink{font-size:10px;padding:3px 9px}

/* regime strip */
.regime-bar{height:3px;border-radius:2px;flex-shrink:0;margin-bottom:7px;
            background:var(--line);transition:background .8s}
.regime-bar.bull{background:linear-gradient(90deg,var(--up),rgba(12,163,12,.06))}
.regime-bar.bear{background:linear-gradient(90deg,var(--dn),rgba(208,59,59,.06))}
.regime-bar.range{background:linear-gradient(90deg,var(--warn),rgba(250,178,25,.06))}
.regime-bar.vol{background:linear-gradient(90deg,var(--violet),rgba(144,133,233,.06))}

/* top band */
.top-band{display:flex;gap:8px;height:150px;flex-shrink:0;margin-bottom:8px}
.eq-card{padding:10px 12px;display:flex;flex-direction:column;flex:1.15;min-width:0}
.eq-hero{display:flex;align-items:baseline;gap:8px;flex-shrink:0;margin-top:4px}
.eq-num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-1.2px;
        font-variant-numeric:tabular-nums}
.eq-delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.eq-sub{color:var(--muted);font-size:10px;margin-top:3px;flex-shrink:0}
canvas.echart{flex:1;min-height:0;width:100%;display:block;margin-top:6px}
.pos-panel{padding:10px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
.pos-scroll{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0;margin-top:6px}
.pos-card{background:var(--surface2);border:1px solid var(--line);border-radius:9px;
          padding:6px 9px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.pos-coin-lbl{font-size:13px;font-weight:800;min-width:36px}
.pos-side{display:flex;flex-direction:column;gap:3px;align-items:flex-start;flex-shrink:0}
.pos-time{font-size:8px;color:var(--muted)}
.pos-nums{flex:1;min-width:0}
.pos-prices{font-size:9px;color:var(--muted);display:flex;gap:7px;font-variant-numeric:tabular-nums}
.pos-pnl{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.15;
         font-variant-numeric:tabular-nums}
.empty-pos{color:var(--muted);font-size:11px;text-align:center;padding:18px 0}

/* mid row */
.mid-row{flex:1;min-height:0;display:flex;gap:8px;margin-bottom:8px}
.grid-band{flex:1;min-width:0;padding:7px;overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
       grid-auto-rows:1fr;gap:6px;height:100%}
body.split .cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}

.cell{background:var(--surface2);border:1px solid var(--line);border-radius:9px;
      padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;
      min-height:0;overflow:hidden;cursor:pointer;transition:border-color .3s,background .2s}
.cell:hover{background:var(--raised);border-color:var(--baseline)}
.cell.sbuy{border-color:var(--up-line);box-shadow:inset 3px 0 0 -1px var(--up)}
.cell.ssell{border-color:var(--dn-line);box-shadow:inset 3px 0 0 -1px var(--dn)}
.cell.nm-hint{border-color:var(--warn-line)}
.cell.open-pos{outline:2px solid var(--acc-line);outline-offset:-2px}
.cell-top{display:flex;align-items:center;gap:5px;min-width:0}
.cell-name{font-size:12px;font-weight:800;letter-spacing:.2px;flex:1;min-width:0}
.cell-price{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-mid{display:flex;align-items:center;justify-content:space-between;margin-top:3px;gap:4px}
.cell-act{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.cell-act.buy{color:var(--up)}.cell-act.sell{color:var(--dn)}.cell-act.sd{color:var(--muted)}
.cell-age{font-size:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell-age.stale{color:var(--serious)}
.cell-strat{font-size:7.5px;color:var(--muted);font-style:italic;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis;max-width:56px}
.cell .adots{margin-top:3px}
.cell .meter{margin-top:4px;height:2px}

/* detail panel */
.detail-panel{display:none;padding:12px;flex-direction:column;min-width:0;flex:1}
.detail-panel.open{display:flex}
.dp-hdr{display:flex;align-items:baseline;gap:8px;flex-shrink:0;margin-bottom:8px;flex-wrap:wrap}
.dp-coin{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
.dp-price{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dp-chg{font-size:12px;font-weight:650}
.dp-int{font-size:9px;color:var(--muted);margin-left:auto}
canvas.dp-chart{width:100%;flex:1;min-height:0;display:none}
.dp-analysts{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;margin-top:8px}
.dp-empty{color:var(--muted);font-size:12px;text-align:center;flex:1;
          display:flex;align-items:center;justify-content:center}

/* footer */
.footer{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;
        padding:0 12px}
canvas.donut{width:38px;height:38px;flex-shrink:0;cursor:pointer}
.f-chips{display:flex;gap:5px;flex:1;flex-wrap:wrap;align-items:center;overflow:hidden}
.kill-sm{flex-shrink:0;padding:8px 13px;font-size:11px}

/* modals */
.modal{width:700px;max-width:95vw}
canvas.cchart{width:100%;height:210px;display:block}
.m-hdr{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.m-coin{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.m-price{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.m-chg{font-size:12px;font-weight:650}
.m-int{font-size:10px;color:var(--muted);margin-left:auto;padding-right:24px}
.m-analysts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tlog-modal{max-height:80vh;display:flex;flex-direction:column}
.tlog-modal h3,.strat-modal h3{font-size:14px;font-weight:750;margin-bottom:10px}
.tlog-scroll{overflow-y:auto;flex:1}
.strat-modal{max-width:620px;max-height:80vh;display:flex;flex-direction:column}
.strat-scroll{overflow-y:auto;flex:1}
.router-hdr{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.router-hdr b{color:var(--ink2)}
.strat-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.strat-row:last-child{border-bottom:none}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--baseline)}
.sdot.on{background:var(--up);box-shadow:0 0 5px var(--up)}
.strat-name{font-size:12px;font-weight:700}
.strat-meta{display:flex;gap:9px;margin-top:3px;flex-wrap:wrap;font-size:9.5px;color:var(--muted)}
.strat-meta b{color:var(--ink2);font-weight:650}
</style>
</head>
<body>

<header class="hd">
  <div class="brand"><span class="name">MiniSim</span><span class="ver" id="verChip">—</span></div>
  <span class="regime" id="regimeBadge">scanning…</span>
  <div class="spacer"></div>
  <div class="cycle-wrap" title="Coins scanned this cycle">
    <canvas class="cycle-arc" id="cycleArc"></canvas>
    <span class="cycle-lbl" id="cycleLbl">—/15</span>
  </div>
  <span class="pulse" id="pulse"></span>
  <span class="chip" id="pmcp">MCP —</span>
  <span class="chip" id="pllm">LLM —</span>
  <span class="chip num" id="clock">—</span>
  <a class="navlink" href="/macro">Macro</a>
  <a class="navlink" href="/report">Report</a>
  <button class="split-btn" id="splitBtn" onclick="toggleSplit()" title="Split screen">⊞ SPLIT</button>
  <button class="wbtn wmin" title="Minimise" onclick="winMinimise()">&#8722;</button>
  <button class="wbtn wcls" title="Close" onclick="window.close()">&#215;</button>
</header>

<div class="regime-bar" id="regimeBar"></div>

<div class="top-band">
  <div class="card eq-card">
    <span class="lab">Portfolio</span>
    <div class="eq-hero">
      <span class="eq-num" id="equity">—</span>
      <span class="eq-delta" id="eqdelta"></span>
    </div>
    <div class="eq-sub" id="eqsub">—</div>
    <canvas class="echart" id="echart"></canvas>
  </div>
  <div class="card pos-panel">
    <span class="lab">Open positions</span>
    <div class="pos-scroll" id="posScroll">
      <div class="empty-pos" id="posEmpty">No open positions</div>
    </div>
  </div>
</div>

<div class="mid-row" id="midRow">
  <div class="card grid-band"><div class="cgrid" id="cgrid"></div></div>
  <div class="card detail-panel" id="detailPanel">
    <div class="dp-hdr">
      <span class="dp-coin" id="dpCoin">—</span>
      <span class="dp-price" id="dpPrice"></span>
      <span class="dp-chg" id="dpChg"></span>
      <span class="dp-int" id="dpInterval"></span>
    </div>
    <canvas class="dp-chart" id="dpChart"></canvas>
    <div class="dp-analysts" id="dpAnalysts"></div>
    <div class="dp-empty" id="dpEmpty">Tap a coin to view its chart</div>
  </div>
</div>

<div class="card footer">
  <canvas class="donut" id="donut" title="Click for trade log" onclick="openTradeLog()"></canvas>
  <div class="f-chips" id="chips"></div>
  <button class="btn danger kill-sm" id="kill" onclick="toggleKill()">◉ KILL SWITCH</button>
</div>

<div class="overlay" id="logOverlay" onclick="if(event.target===this)closeTradeLog()">
  <div class="modal tlog-modal">
    <button class="modal-close" onclick="closeTradeLog()">×</button>
    <h3>Trade log</h3>
    <div class="tlog-scroll">
      <table class="tbl">
        <thead><tr><th>Date</th><th>Side</th><th>Coin</th><th>Strategy</th>
          <th>Entry</th><th>Exit</th><th>Qty</th><th>P/L</th></tr></thead>
        <tbody id="tradeLogBody"></tbody>
      </table>
      <div class="modal-loading" id="tradeLogEmpty" style="display:none">No closed trades yet</div>
    </div>
  </div>
</div>

<div class="overlay" id="stratOverlay" onclick="if(event.target===this)closeStratModal()">
  <div class="modal strat-modal">
    <button class="modal-close" onclick="closeStratModal()">×</button>
    <h3>Strategies</h3>
    <div id="stratModalBody"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="m-hdr">
      <span class="m-coin" id="mCoin">—</span>
      <span class="m-price" id="mPrice">—</span>
      <span class="m-chg" id="mChg"></span>
      <span class="m-int" id="mInterval">15m</span>
    </div>
    <div id="mBody"><div class="modal-loading">Loading…</div></div>
    <div class="m-analysts" id="mAnalysts"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const {fmt,fmtp,esc,fmtPrice,sigAge,isStale,timeInPos,regimeCls,api,analystDots,
       analystChips,coinDot,ALL_COINS}=MS;
let killOn=false,_tradeCache=[],_stratCache={};
let splitMode=localStorage.getItem('minisim_split')==='1';

async function winMinimise(){try{await api('/api/wm/minimize',{method:'POST'});}catch(e){}window.blur();}

function drawCycleArc(cv,progress,count){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1,s=24*dpr,t=MS.tok();
  cv.width=s;cv.height=s;
  const ctx=cv.getContext('2d'),cx=s/2,cy=s/2,r=s/2-2.5*dpr,lw=2.5*dpr;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=t.grid;ctx.lineWidth=lw;ctx.stroke();
  if(progress>0){ctx.beginPath();
    ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);
    ctx.strokeStyle=t.acc;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();}
  ctx.fillStyle=progress>=1?t.up:t.muted;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold ${7*dpr}px system-ui,sans-serif`;
  ctx.fillText(count,cx,cy);
}
function calcCycleProgress(decisions){
  if(!decisions||!decisions.length)return{count:0,progress:0};
  const sorted=[...decisions].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const newest=new Date(sorted[0].timestamp).getTime();
  const seen=new Set();
  sorted.forEach(d=>{if(!seen.has(d.coin)&&(newest-new Date(d.timestamp).getTime())<=660000)seen.add(d.coin);});
  const count=Math.min(seen.size,15);
  return{count,progress:count/15};
}

/* split screen */
function applySplit(){
  document.body.classList.toggle('split',splitMode);
  document.getElementById('detailPanel').classList.toggle('open',splitMode);
  const btn=document.getElementById('splitBtn');
  btn.classList.toggle('on',splitMode);
  btn.textContent=splitMode?'⊟ SPLIT':'⊞ SPLIT';
}
function toggleSplit(){
  splitMode=!splitMode;
  localStorage.setItem('minisim_split',splitMode?'1':'0');
  applySplit();
  if(!splitMode){
    document.getElementById('dpChart').style.display='none';
    document.getElementById('dpEmpty').style.display='flex';
    document.getElementById('dpAnalysts').innerHTML='';
    document.getElementById('dpCoin').textContent='—';
    document.getElementById('dpPrice').textContent='';
    document.getElementById('dpChg').textContent='';
    document.getElementById('dpInterval').textContent='';
  }
}
applySplit();

async function openDetailPanel(coin){
  const sig=(window._lastSigs||{})[coin]||{};
  document.getElementById('dpCoin').innerHTML=`${coinDot(coin,20)}${esc(coin)}`;
  document.getElementById('dpPrice').textContent='—';
  document.getElementById('dpChg').textContent='';
  document.getElementById('dpInterval').textContent='loading…';
  document.getElementById('dpEmpty').style.display='none';
  document.getElementById('dpAnalysts').innerHTML=analystChips(sig.analysts);
  const cv=document.getElementById('dpChart');cv.style.display='none';
  try{
    const data=await(await api(`/api/candles?coin=${encodeURIComponent(coin)}&limit=60`)).json();
    const cs=data.candles||[];
    if(cs.length){
      const last=cs[cs.length-1][3],first=cs[0][3],chg=((last-first)/first)*100;
      document.getElementById('dpPrice').textContent='$'+fmt(last);
      const el=document.getElementById('dpChg');
      el.textContent=fmtp(chg);el.className='dp-chg '+(chg>=0?'up':'dn');
      document.getElementById('dpInterval').textContent=`${data.interval} · ${cs.length} candles`;
      cv.style.display='block';
      requestAnimationFrame(()=>MS.drawCandles(cv,cs));
    }
  }catch(e){document.getElementById('dpInterval').textContent='chart unavailable';}
}

function chipPill(id,txt,ok){
  const e=document.getElementById(id);
  e.innerHTML=`<b class="${ok?'up':'dn'}">●</b> ${esc(txt)}`;
}

/* strategy modal */
function renderStratModal(data){
  _stratCache=data;
  const el=document.getElementById('stratModalBody');
  const state=data.state||{},cat=data.catalogue||{};
  const active=new Set(state.active_strategies||[]);
  const perf=state.last_perf||{};
  const ms=state.last_market_state||{};
  const dir=ms.direction||state.direction||'—';
  const risk=state.risk_level!=null?state.risk_level:1.0;
  const age=state.last_run?sigAge(new Date(state.last_run*1000).toISOString()):'—';
  let html=`<div class="router-hdr">
    <span class="regime ${regimeCls(dir)}">${esc(String(dir).toUpperCase())} market</span>
    &ensp;risk <b>×${risk}</b> · router ran <b>${esc(age)}</b> ago<br>
    Active: <b>${esc(active.size?[...active].join(', '):'none selected')}</b>
    ${state.reasoning?`<br><span style="font-style:italic">${esc(state.reasoning)}</span>`:''}
  </div><div class="strat-scroll">`;
  const names=Object.keys(cat);
  names.sort((a,b)=>(active.has(b)?1:0)-(active.has(a)?1:0));
  names.forEach(name=>{
    const info=cat[name]||{},on=active.has(name),sp=perf[name]||{};
    const side=info.side||'BOTH';
    const pnlCls=sp.pnl_usd!=null?(sp.pnl_usd>=0?'up':'dn'):'dim';
    const pnl=sp.pnl_usd!=null?(sp.pnl_usd>=0?'+':'')+'$'+Number(sp.pnl_usd).toFixed(2):'—';
    html+=`<div class="strat-row">
      <div class="sdot ${on?'on':''}"></div>
      <div style="flex:1;min-width:0">
        <span class="strat-name">${esc(info.label||name)}</span>
        <span class="tag ${side}" style="margin-left:5px;vertical-align:middle">${side}</span>
        <div class="strat-meta">
          ${info.sl_pct!=null?`<span>SL <b>${(info.sl_pct*100).toFixed(1)}%</b></span>`:''}
          ${info.tp1_pct!=null?`<span>TP <b>${[info.tp1_pct,info.tp2_pct,info.tp3_pct].filter(Boolean).map(t=>(t*100).toFixed(1).replace('.0','')).join('/')}%</b></span>`:''}
          ${sp.trades?`<span><b>${sp.trades}</b> trades · WR <b>${Math.round(sp.win_rate||0)}%</b> · <span class="${pnlCls}">${pnl}</span></span>`
                     :'<span style="font-style:italic">no trades yet</span>'}
        </div>
      </div>
    </div>`;
  });
  if(!names.length)html+='<div class="dim" style="font-size:12px;padding:8px 0">Router not yet initialised</div>';
  el.innerHTML=html+'</div>';
}
function openStratModal(){document.getElementById('stratOverlay').classList.add('open');renderStratModal(_stratCache);}
function closeStratModal(){document.getElementById('stratOverlay').classList.remove('open');}

/* main load */
async function load(){
  try{
    const[sR,dR,pR,hR,prR,ssR]=await Promise.all([
      api('/api/status'),api('/api/decisions?limit=60'),
      api('/api/performance?limit=50'),api('/api/equity_history'),
      api('/api/prices'),api('/api/strategy_state')]);
    const s=await sR.json(),d=await dR.json();
    const perf=await pR.json(),hist=await hR.json();
    const prices=await prR.json();
    try{renderStratModal(await ssR.json());}catch(_){}

    const nmCoins=new Set();
    d.forEach(dec=>{if(dec.action==='STAND_DOWN'&&(dec.confidence||0)>=0.45&&
      (Date.now()-new Date(dec.timestamp).getTime())<720000)nmCoins.add(dec.coin);});

    const pl=document.getElementById('pulse');
    pl.classList.add('on');setTimeout(()=>pl.classList.remove('on'),700);

    document.getElementById('verChip').textContent=
      'v'+String(s.version||'—').split('.')[0]+' · '+String(s.mode||'—').toUpperCase();
    document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    chipPill('pmcp','MCP '+(s.mcp_transport||'?'),s.mcp_transport==='mcp');
    chipPill('pllm','LLM '+(s.llm_backend||'?'),s.llm_model_present!==false);

    const rc=regimeCls(s.regime);
    const rb=document.getElementById('regimeBadge');
    rb.textContent=(s.regime&&s.regime!=='—'?s.regime:'scanning…')+' regime';
    rb.className='regime '+rc;
    document.getElementById('regimeBar').className='regime-bar '+rc;

    const{count,progress}=calcCycleProgress(d);
    drawCycleArc(document.getElementById('cycleArc'),progress,count);
    document.getElementById('cycleLbl').textContent=count+'/15';

    document.getElementById('equity').textContent='$'+fmt(s.equity_usd);
    const startEq=hist.length?hist[0].equity:null;
    const delta=startEq!=null&&s.equity_usd!=null?s.equity_usd-startEq:0;
    const ed=document.getElementById('eqdelta');
    if(delta){ed.textContent=(delta>=0?'+':'−')+'$'+fmt(Math.abs(delta))+' ('+fmtp(delta/startEq*100)+')';
      ed.className='eq-delta '+(delta>=0?'up':'dn');}else ed.textContent='';
    document.getElementById('eqsub').textContent=
      `Cash $${fmt(s.cash_usd)} · ${s.open_positions||0} open · cycle ${s.last_cycle||'—'} · up ${s.uptime||'—'}`;
    MS.drawEquity(document.getElementById('echart'),hist);

    /* positions */
    const pos=s.positions||[];
    const posScroll=document.getElementById('posScroll');
    const openCoins=new Set(pos.map(p=>p.coin));
    document.getElementById('posEmpty').style.display=pos.length?'none':'block';
    posScroll.querySelectorAll('.pos-card').forEach(el=>el.remove());
    pos.forEach(p=>{
      const pnlCls=p.unrealised_pnl_pct>=0?'up':'dn';
      const barW=Math.min(Math.abs(p.unrealised_pnl_pct||0)*8,100);
      const side=p.side||'LONG';
      const age=timeInPos(p.opened_at);
      const card=document.createElement('div');
      card.className='pos-card';
      card.innerHTML=`${coinDot(p.coin,22)}
        <span class="pos-coin-lbl">${esc(p.coin)}</span>
        <div class="pos-side">
          <span class="tag ${side}">${side}</span>
          ${age?`<span class="pos-time">${esc(age)}${p.strat_name?' · '+esc(p.strat_name):''}</span>`:''}
        </div>
        <div class="pos-nums">
          <div class="pos-prices"><span>in ${fmtPrice(p.entry_price)}</span><span>now ${fmtPrice(p.current_price)}</span></div>
          <div class="pos-pnl ${pnlCls}">${fmtp(p.unrealised_pnl_pct)}</div>
          <div class="meter"><i class="${pnlCls==='up'?'buy':'sell'}" style="width:${barW}%"></i></div>
        </div>`;
      posScroll.insertBefore(card,document.getElementById('posEmpty'));
    });

    /* coin grid */
    const sigs={};d.forEach(dec=>{if(!sigs[dec.coin])sigs[dec.coin]=dec;});
    window._lastSigs=sigs;
    const cg=document.getElementById('cgrid');cg.innerHTML='';
    [...new Set([...ALL_COINS,...Object.keys(sigs)])].slice(0,15).forEach((coin,i)=>{
      const sig=sigs[coin]||{};
      const act=sig.action||'STAND_DOWN';
      const label=act.replace('ENTRY_','');
      const conf=Math.round((sig.confidence||0)*100);
      const cls=act.includes('BUY')?'buy':act.includes('SELL')?'sell':'sd';
      const sigCls=act.includes('BUY')?'sbuy':act.includes('SELL')?'ssell':'';
      const nmCls=(cls==='sd'&&nmCoins.has(coin))?'nm-hint':'';
      const age=sig.timestamp?sigAge(sig.timestamp):'';
      const stratMatch=(sig.reasoning||'').match(/strategy[=:](\w+)/i);
      const stratTag=stratMatch&&stratMatch[1]!=='none'?stratMatch[1]:'';
      const div=document.createElement('div');
      div.className=`cell ${sigCls} ${nmCls} ${openCoins.has(coin)?'open-pos':''}`;
      div.title=`${coin}${openCoins.has(coin)?' · OPEN POSITION':''}${nmCls?' · near miss':''} — tap for chart`;
      div.onclick=()=>openModal(coin);
      div.innerHTML=`
        <div class="cell-top">${coinDot(coin,20)}
          <span class="cell-name">${esc(coin)}</span>
          <span class="cell-price">${fmtPrice(prices[coin]??null)}</span>
        </div>
        <div class="cell-mid">
          <span class="cell-act ${cls}">${esc(label)}${conf?' '+conf+'%':''}</span>
          ${cls!=='sd'&&stratTag?`<span class="cell-strat">${esc(stratTag)}</span>`:''}
          ${age?`<span class="cell-age${isStale(sig.timestamp)?' stale':''}">${esc(age)}</span>`:''}
        </div>
        <div class="adots">${analystDots(sig.analysts)}</div>
        <div class="meter"><i class="${cls}" style="width:${conf}%"></i></div>`;
      cg.appendChild(div);
    });

    /* footer */
    MS.drawDonut(document.getElementById('donut'),perf.wins||0,perf.trades||0);
    const pc=(perf.realized_usd||0)>=0?'up':'dn';
    const ac2=(perf.avg_pnl_pct||0)>=0?'up':'dn';
    const upd=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('chips').innerHTML=
      `<span class="chip"><b>${perf.trades||0}</b> trades</span>
       <span class="chip">avg <b class="${ac2}">${fmtp(perf.avg_pnl_pct)}</b></span>
       <span class="chip">real <b class="${pc}">${(perf.realized_usd||0)>=0?'+':'−'}$${fmt(Math.abs(perf.realized_usd||0))}</b></span>
       <span class="chip click" id="stratChip" onclick="openStratModal()" title="Strategy details">⚡ STRAT</span>
       <span class="chip" id="fngChip">— F&amp;G</span>
       <span class="chip" id="fundChip">— fund</span>
       <span class="chip" id="domChip">— dom</span>
       <span class="chip" id="vixChip">VIX —</span>
       <span class="chip" id="dxyChip">DXY —</span>
       <span class="chip" id="lsChip">L/S —</span>
       <span class="chip dim num">↻ ${esc(upd)}</span>`;
    const activeStrats=(_stratCache.state||{}).active_strategies||[];
    if(activeStrats.length)
      document.getElementById('stratChip').innerHTML='⚡ '+esc(activeStrats.slice(0,3).join(' · '));

    try{
      const md=await(await api('/api/macro')).json();
      const t=MS.tok();
      const fng=md.fear_greed||{},fv=fng.value??50;
      const set=(id,html,title)=>{const e=document.getElementById(id);if(e){e.innerHTML=html;if(title)e.title=title;}};
      set('fngChip',`<b style="color:${MS.fngColor(fv)}">${fv}</b> F&G`,`Fear & Greed: ${fv} — ${fng.label||''}`);
      const af=md.avg_funding_pct??0;
      const fCol=af>0.05?t.dn:af<-0.03?t.up:t.muted;
      set('fundChip',`<b style="color:${fCol}">${af>=0?'+':''}${af.toFixed(4)}%</b> fund`,`Avg funding — ${md.funding_bias||'neutral'}`);
      const btcD=(md.dominance||{}).btc_dominance??0;
      if(btcD)set('domChip',`BTC <b>${btcD.toFixed(1)}%</b>`,`BTC dominance`);
      const tf=md.tradfi||{};
      const vix=(tf.vix||{}).price??0;
      if(vix)set('vixChip',`VIX <b style="color:${vix>30?t.dn:vix>25?t.warn:t.muted}">${vix.toFixed(1)}</b>`,`VIX ${vix.toFixed(1)}`);
      const dxy=(tf.dxy||{}).price??0,dxyChg=(tf.dxy||{}).change_pct??0;
      if(dxy)set('dxyChip',`DXY <b style="color:${dxyChg>0.5?t.dn:dxyChg<-0.5?t.up:t.muted}">${dxy.toFixed(1)}</b>`,`DXY ${dxy.toFixed(2)} (${dxyChg>=0?'+':''}${dxyChg.toFixed(2)}%)`);
      const btcLP=(((md.long_short_ratio||{}).BTC||{}).long_pct??0.5)*100;
      if(btcLP)set('lsChip',`L/S <b style="color:${btcLP>70?t.dn:btcLP<35?t.up:t.muted}">${btcLP.toFixed(0)}%L</b>`,`BTC accounts ${btcLP.toFixed(1)}% long`);
    }catch(_){}

    _tradeCache=perf.recent||[];
    killOn=!!s.kill_switch;
    const k=document.getElementById('kill');
    k.className='btn kill-sm '+(killOn?'safe':'danger');
    k.textContent=killOn?'◉ RESUME ENTRIES':'◉ KILL SWITCH';
  }catch(e){document.getElementById('clock').textContent='offline';}
}

async function toggleKill(){
  await api(killOn?'/api/resume':'/api/kill',{method:'POST'});load();
}

function openTradeLog(){
  const body=document.getElementById('tradeLogBody');
  document.getElementById('tradeLogEmpty').style.display=_tradeCache.length?'none':'block';
  body.innerHTML=_tradeCache.map(t=>{
    const side=(t.direction||'long').toUpperCase();
    const c=t.pnl_pct>=0?'up':'dn';
    const dt=t.buy_ts?new Date(t.buy_ts).toLocaleDateString([],{month:'short',day:'numeric'})
      +' '+new Date(t.buy_ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
    return`<tr>
      <td class="dim num" style="font-size:10px;white-space:nowrap">${esc(dt)}</td>
      <td><span class="tag ${side}">${side}</span></td>
      <td><b>${esc(t.coin)}</b></td>
      <td class="dim" style="font-size:10px">${esc(t.strategy||'—')}</td>
      <td class="dim num">${fmtPrice(t.open_price)}</td>
      <td class="dim num">${fmtPrice(t.close_price)}</td>
      <td class="dim num">${fmt(t.qty)}</td>
      <td class="${c} num" style="font-weight:700">${fmtp(t.pnl_pct)}</td></tr>`;
  }).join('');
  document.getElementById('logOverlay').classList.add('open');
}
function closeTradeLog(){document.getElementById('logOverlay').classList.remove('open');}

async function openModal(coin){
  if(splitMode)return openDetailPanel(coin);
  const sig=(window._lastSigs||{})[coin]||{};
  document.getElementById('overlay').classList.add('open');
  document.getElementById('mCoin').innerHTML=`${coinDot(coin,22)}${esc(coin)}`;
  document.getElementById('mPrice').textContent='—';
  document.getElementById('mChg').textContent='';
  document.getElementById('mInterval').textContent='15m · loading…';
  document.getElementById('mBody').innerHTML='<div class="modal-loading">Loading chart…</div>';
  document.getElementById('mAnalysts').innerHTML=analystChips(sig.analysts);
  try{
    const data=await(await api(`/api/candles?coin=${encodeURIComponent(coin)}&limit=60`)).json();
    const cs=data.candles||[];
    if(cs.length){
      const last=cs[cs.length-1][3],first=cs[0][3],chg=((last-first)/first)*100;
      document.getElementById('mPrice').textContent='$'+fmt(last);
      const mc=document.getElementById('mChg');
      mc.textContent=fmtp(chg);mc.className='m-chg '+(chg>=0?'up':'dn');
      document.getElementById('mInterval').textContent=`${data.interval} · ${cs.length} candles`;
      document.getElementById('mBody').innerHTML='<canvas class="cchart" id="cchart"></canvas>';
      MS.drawCandles(document.getElementById('cchart'),cs);
    }
  }catch(e){document.getElementById('mBody').innerHTML='<div class="modal-loading">Failed to load chart</div>';}
}
function closeModal(){document.getElementById('overlay').classList.remove('open');MS.hideTip();}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeTradeLog();closeStratModal();}
});

const _autoOpen=new URLSearchParams(location.search).get('open');
if(_autoOpen){load().then(()=>openModal(_autoOpen.toUpperCase()));}else{load();}
setInterval(load,5000);
</script>
</body>
</html>
