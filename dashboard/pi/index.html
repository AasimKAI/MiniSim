<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="csrf-token" content="__CSRF__">
<title>MiniSim v5</title>
<style>
:root {
  --bg:#0b0e14; --card:#151a23; --card2:#0e131b; --line:#222c3a;
  --txt:#e6edf3; --dim:#8b98a9;
  --up:#3fb950; --dn:#f85149; --warn:#d29922; --acc:#58a6ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);
     font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
     display:flex;flex-direction:column;padding:8px 8px 0 8px}

/* ── HEADER ── */
.hd{display:flex;align-items:center;gap:6px;height:36px;flex-shrink:0;margin-bottom:5px}
.brand{font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap;margin-right:2px}
.brand small{color:var(--dim);font-weight:400;font-size:10px}
.regime-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;
              letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;transition:all .6s}
.rb-none{background:var(--card);color:var(--dim);border:1px solid var(--line)}
.rb-bull{background:rgba(63,185,80,.14);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.rb-bear{background:rgba(248,81,73,.14);color:#f85149;border:1px solid rgba(248,81,73,.3)}
.rb-range{background:rgba(210,153,34,.14);color:#d29922;border:1px solid rgba(210,153,34,.3)}
.rb-vol{background:rgba(153,69,255,.14);color:#9945ff;border:1px solid rgba(153,69,255,.3)}
.hd-spacer{flex:1}
.cycle-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cycle-lbl{font-size:9px;color:var(--dim);white-space:nowrap}
canvas.cycle-arc{display:block;flex-shrink:0}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;
      background:var(--card);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--up);border-color:rgba(63,185,80,.3)}
.pill.bad{color:var(--dn);border-color:rgba(248,81,73,.3)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0;
       transition:background .4s,box-shadow .4s}
.pulse.on{background:var(--up);box-shadow:0 0 6px var(--up)}
.wctrl{display:flex;gap:4px;align-items:center;margin-left:2px}
.wbtn{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
      font-size:13px;line-height:1;display:flex;align-items:center;
      justify-content:center;transition:opacity .15s;flex-shrink:0}
.wbtn:hover{opacity:.7}
.wbtn.wmin{background:#d29922;color:#000}
.wbtn.wcls{background:#f85149;color:#fff}

/* ── REGIME BAR ── */
.regime-bar{height:3px;border-radius:2px;flex-shrink:0;margin-bottom:7px;
            transition:background .8s;background:var(--line)}
.regime-bar.rb-bull{background:linear-gradient(90deg,#3fb950 0%,rgba(63,185,80,.08) 100%)}
.regime-bar.rb-bear{background:linear-gradient(90deg,#f85149 0%,rgba(248,81,73,.08) 100%)}
.regime-bar.rb-range{background:linear-gradient(90deg,#d29922 0%,rgba(210,153,34,.08) 100%)}
.regime-bar.rb-vol{background:linear-gradient(90deg,#9945ff 0%,rgba(153,69,255,.08) 100%)}

/* ── TOP BAND ── */
.top-band{display:flex;gap:8px;height:148px;flex-shrink:0;margin-bottom:7px}

/* equity card */
.eq-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:10px 12px;display:flex;flex-direction:column;flex:1.15;min-width:0}
.panel-lab{color:var(--dim);font-size:9px;text-transform:uppercase;
           letter-spacing:1.5px;margin-bottom:5px;flex-shrink:0}
.eq-hero{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.eq-num{font-size:32px;font-weight:800;line-height:1;letter-spacing:-1.5px;
        font-variant-numeric:tabular-nums}
.eq-delta{font-size:12px;font-weight:700}
.eq-sub{color:var(--dim);font-size:10px;margin-top:2px;flex-shrink:0}
canvas.echart{flex:1;min-height:0;width:100%;display:block;margin-top:6px}

/* positions panel */
.pos-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
           padding:10px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
.pos-scroll{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0}
.pos-card{background:var(--card2);border:1px solid var(--line);border-radius:8px;
          padding:6px 9px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.pos-coin-lbl{font-size:14px;font-weight:800;letter-spacing:.2px;min-width:38px}
.pos-side-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex-shrink:0}
.side{font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.6px}
.side.LONG{color:var(--acc);background:#13233a;border:1px solid #1e3a5c}
.side.SHORT{color:var(--warn);background:#332608;border:1px solid #4d3a0d}
.pos-time{font-size:8px;color:var(--dim)}
.pos-nums{flex:1;min-width:0}
.pos-prices{font-size:9.5px;color:var(--dim);display:flex;gap:6px}
.pos-pnl{font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1.1;
         font-variant-numeric:tabular-nums}
.pos-bar-bg{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:3px}
.pos-bar{height:3px;border-radius:2px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.empty-pos{color:var(--dim);font-size:11px;text-align:center;padding:18px 0}

/* ── COIN GRID ── */
.grid-band{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);
           border-radius:12px;padding:7px;margin-bottom:7px;overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:100%}

@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes glowBuy{
  0%,100%{box-shadow:0 0 4px rgba(63,185,80,.15)}
  50%{box-shadow:0 0 14px rgba(63,185,80,.5)}}
@keyframes glowSell{
  0%,100%{box-shadow:0 0 4px rgba(248,81,73,.15)}
  50%{box-shadow:0 0 14px rgba(248,81,73,.5)}}

.cell{background:var(--card2);border:1px solid var(--line);border-radius:8px;
      padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;
      min-height:0;overflow:hidden;cursor:pointer;
      opacity:0;animation:fadeUp .3s ease forwards;
      transition:border-color .3s,box-shadow .3s,background .2s}
.cell:hover{background:#121820;border-color:#3a4a5e}
.cell.sbuy{border-color:rgba(63,185,80,.4);
           animation:fadeUp .3s ease forwards,glowBuy 3s ease-in-out infinite}
.cell.ssell{border-color:rgba(248,81,73,.4);
            animation:fadeUp .3s ease forwards,glowSell 3s ease-in-out infinite}
.cell.open-pos{outline:2px solid rgba(88,166,255,.55);outline-offset:-2px}

.cell-top{display:flex;align-items:center;gap:5px;min-width:0}
.coin-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;
          align-items:center;justify-content:center;font-size:6px;font-weight:800;color:#fff}
.cell-name{font-size:12px;font-weight:800;letter-spacing:.3px;flex:1;min-width:0}
.cell-price{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}

.cell-mid{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.cell-act{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.cell-age{font-size:8px;color:var(--dim);font-variant-numeric:tabular-nums}
.cell-age.stale{color:#7a4040}

.adots{display:flex;gap:2px;margin-top:3px}
.adot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .5s}

.cell-bar-bg{height:2px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:4px}
.cell-bar{height:2px;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abuy{color:var(--up)}.asell{color:var(--dn)}.asd{color:var(--dim)}
.bbuy{background:var(--up)}.bsell{background:var(--dn)}.bsd{background:#3a4a5c}

/* ── FOOTER ── */
.footer{height:52px;flex-shrink:0;margin-bottom:8px;display:flex;align-items:center;
        gap:8px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:0 12px}
canvas.donut{width:38px;height:38px;flex-shrink:0;cursor:pointer}
.f-chips{display:flex;gap:5px;flex:1;flex-wrap:wrap;align-items:center;overflow:hidden}
.chip{font-size:10px;padding:2px 7px;border-radius:6px;
      background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--txt)}
.chip.clickable{cursor:pointer}
.chip.clickable:hover{border-color:#3a4a5e}
.kill{flex-shrink:0;border-radius:8px;padding:9px 14px;font-size:11px;font-weight:700;
      cursor:pointer;white-space:nowrap;letter-spacing:.3px;
      background:#3a1414;color:#ff8d85;border:1px solid #5e2020;transition:background .2s}
.kill.on{background:#1d3b27;color:#7ee0a0;border-color:#2c5e3e}

/* ── SPLIT TOGGLE BUTTON ── */
.split-btn{font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);
           background:var(--card2);color:var(--dim);cursor:pointer;letter-spacing:.4px;
           font-weight:700;font-family:inherit;transition:all .15s}
.split-btn.on{background:#1e3a5c;color:var(--acc);border-color:rgba(88,166,255,.4)}
.split-btn:hover{opacity:.8}

/* ── MID ROW (grid + detail panel) ── */
.mid-row{flex:1;min-height:0;display:flex;gap:7px;margin-bottom:7px}
.mid-row .grid-band{flex:1;margin-bottom:0}
body.split .cgrid{grid-template-columns:repeat(3,1fr)}

/* ── DETAIL PANEL ── */
.detail-panel{display:none;background:var(--card);border:1px solid var(--line);
              border-radius:12px;padding:12px;flex-direction:column;min-width:0;flex:1}
.detail-panel.open{display:flex}
.dp-hdr{display:flex;align-items:baseline;gap:8px;flex-shrink:0;margin-bottom:8px;flex-wrap:wrap}
.dp-coin{font-size:18px;font-weight:800}
.dp-price{font-size:13px;color:var(--dim)}
.dp-chg{font-size:12px;font-weight:600}
.dp-interval{font-size:9px;color:var(--dim);margin-left:auto}
canvas.dp-chart{width:100%;flex:1;min-height:0;display:none}
.dp-analysts{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;margin-top:8px}
.dp-empty{color:var(--dim);font-size:12px;text-align:center;flex:1;
          display:flex;align-items:center;justify-content:center}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:200;
         display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;
       width:700px;max-width:95vw;padding:16px;position:relative}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;
             color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--txt)}
/* candlestick modal */
.modal-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.modal-coin{font-size:22px;font-weight:800}
.modal-price{font-size:16px;font-weight:600;color:var(--dim)}
.modal-chg{font-size:13px;font-weight:600}
.modal-interval{font-size:10px;color:var(--dim);margin-left:auto}
canvas.cchart{width:100%;height:200px;display:block}
.analysts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.av{font-size:10px;padding:3px 8px;border-radius:6px;
    background:var(--card2);border:1px solid var(--line)}
.av b{color:var(--txt)}
.av.bull b{color:var(--up)}.av.bear b{color:var(--dn)}.av.neut b{color:var(--dim)}
.modal-loading{color:var(--dim);font-size:12px;padding:60px;text-align:center}
/* trade log modal */
.tlog-modal{max-height:80vh;display:flex;flex-direction:column}
.tlog-modal h3{font-size:15px;font-weight:700;margin-bottom:12px}
.tlog-scroll{overflow-y:auto;flex:1}
.tlog-scroll table{width:100%;border-collapse:collapse;font-size:12px}
.tlog-scroll th{text-align:left;color:var(--dim);font-weight:500;font-size:9px;
                text-transform:uppercase;padding:3px 4px 3px 0;white-space:nowrap;
                position:sticky;top:0;background:var(--card)}
.tlog-scroll td{padding:5px 4px 5px 0;border-top:1px solid var(--line);vertical-align:middle}
.tdir{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.5px}
.tdir.LONG{color:var(--acc);background:#13233a;border:1px solid #1e3a5c}
.tdir.SHORT{color:var(--warn);background:#332608;border:1px solid #4d3a0d}

.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}

/* strategy modal */
.strat-modal{max-height:80vh;display:flex;flex-direction:column;max-width:600px}
.strat-modal h3{font-size:15px;font-weight:700;margin-bottom:4px}
.strat-router-hdr{font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.strat-router-hdr b{color:var(--txt)}
.strat-router-hdr .bull{color:var(--up)}.strat-router-hdr .bear{color:var(--dn)}.strat-router-hdr .neutral{color:var(--warn)}
.strat-scroll{overflow-y:auto;flex:1}
.strat-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.strat-row:last-child{border-bottom:none}
.strat-active-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.strat-active-dot.on{background:var(--up);box-shadow:0 0 5px var(--up)}
.strat-active-dot.off{background:var(--line)}
.strat-info{flex:1;min-width:0}
.strat-name{font-size:12px;font-weight:700}
.strat-badge{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;
             border-radius:4px;letter-spacing:.3px;margin-left:5px;vertical-align:middle}
.strat-badge.LONG {color:var(--acc);background:#13233a;border:1px solid #1e3a5c}
.strat-badge.SHORT{color:var(--warn);background:#332608;border:1px solid #4d3a0d}
.strat-badge.BOTH {color:var(--dim);background:var(--card2);border:1px solid var(--line)}
.strat-meta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap}
.strat-meta span{font-size:9px;color:var(--dim)}
.strat-meta b{color:var(--txt);font-weight:600}
.strat-reason{font-size:10px;color:var(--dim);line-height:1.4;
              padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:2px}
</style>
</head>
<body>

<header class="hd">
  <div class="brand">MiniSim <small>v5 · <span id="mode">—</span></small></div>
  <span class="regime-badge rb-none" id="regimeBadge">scanning…</span>
  <div class="hd-spacer"></div>
  <div class="cycle-wrap" title="Cycle progress — coins scanned this cycle">
    <canvas class="cycle-arc" id="cycleArc" width="24" height="24"></canvas>
    <span class="cycle-lbl" id="cycleLbl">—/15</span>
  </div>
  <span class="pulse" id="pulse"></span>
  <span class="pill" id="pmcp">MCP —</span>
  <span class="pill" id="pllm">LLM —</span>
  <span class="pill" id="clock">—</span>
  <a href="/report" style="font-size:10px;color:var(--acc);text-decoration:none;
     padding:2px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line)">Report</a>
  <button class="split-btn" id="splitBtn" onclick="toggleSplit()" title="Split screen">⊞ SPLIT</button>
  <div class="wctrl">
    <button class="wbtn wmin" title="Minimise (Super+D)" onclick="winMinimise()">&#8722;</button>
    <button class="wbtn wcls" title="Close (Alt+F4)" onclick="winClose()">&#215;</button>
  </div>
</header>

<div class="regime-bar rb-none" id="regimeBar"></div>

<div class="top-band">
  <div class="eq-card">
    <div class="panel-lab">Portfolio</div>
    <div class="eq-hero">
      <span class="eq-num" id="equity">—</span>
      <span class="eq-delta" id="eqdelta"></span>
    </div>
    <div class="eq-sub" id="eqsub">—</div>
    <canvas class="echart" id="echart"></canvas>
  </div>

  <div class="pos-panel">
    <div class="panel-lab">Open Positions</div>
    <div class="pos-scroll" id="posScroll">
      <div class="empty-pos" id="posEmpty">No open positions</div>
    </div>
  </div>
</div>

<div class="mid-row" id="midRow">
  <div class="grid-band">
    <div class="cgrid" id="cgrid"></div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="dp-hdr">
      <span class="dp-coin" id="dpCoin">—</span>
      <span class="dp-price" id="dpPrice"></span>
      <span class="dp-chg" id="dpChg"></span>
      <span class="dp-interval" id="dpInterval"></span>
    </div>
    <canvas class="dp-chart" id="dpChart"></canvas>
    <div class="dp-analysts" id="dpAnalysts"></div>
    <div class="dp-empty" id="dpEmpty">Tap a coin to view its chart</div>
  </div>
</div>

<div class="footer">
  <canvas class="donut" id="donut" title="Click for trade log" onclick="openTradeLog()"></canvas>
  <div class="f-chips" id="chips"></div>
  <button class="kill" id="kill" onclick="toggleKill()">◉ KILL SWITCH</button>
</div>

<!-- trade log overlay -->
<div class="overlay" id="logOverlay" onclick="if(event.target===this)closeTradeLog()">
  <div class="modal tlog-modal">
    <button class="modal-close" onclick="closeTradeLog()">×</button>
    <h3>Trade Log</h3>
    <div class="tlog-scroll">
      <table>
        <thead><tr>
          <th>Date</th><th>Side</th><th>Coin</th>
          <th>Entry</th><th>Exit</th><th>Qty</th><th>P/L</th>
        </tr></thead>
        <tbody id="tradeLogBody"></tbody>
      </table>
      <div class="modal-loading" id="tradeLogEmpty" style="display:none">No closed trades yet</div>
    </div>
  </div>
</div>

<!-- strategy modal -->
<div class="overlay" id="stratOverlay" onclick="if(event.target===this)closeStratModal()">
  <div class="modal strat-modal">
    <button class="modal-close" onclick="closeStratModal()">×</button>
    <h3>Strategies</h3>
    <div id="stratModalBody"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<!-- candlestick modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-hdr">
      <span class="modal-coin" id="mCoin">—</span>
      <span class="modal-price" id="mPrice">—</span>
      <span class="modal-chg" id="mChg"></span>
      <span class="modal-interval" id="mInterval">15m · 60 candles</span>
    </div>
    <div id="mBody"><div class="modal-loading">Loading…</div></div>
    <div class="analysts" id="mAnalysts"></div>
  </div>
</div>

<script>
/* ── utils ── */
function winClose(){
  window.close();
}
async function winMinimise(){
  try{await api('/api/wm/minimize',{method:'POST'});}catch(e){}
  window.blur();
}

const fmt   = n => n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtp  = n => n==null?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%';
const esc   = s => String(s??'').replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtPrice(p){
  if(p==null)return'—';
  if(p>=1000)return'$'+Number(p).toLocaleString(undefined,{maximumFractionDigits:0});
  if(p>=1)   return'$'+Number(p).toLocaleString(undefined,{maximumFractionDigits:2});
  return'$'+Number(p).toPrecision(4);
}
function sigAge(ts){
  if(!ts)return'';
  const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<60)return Math.round(s)+'s';
  if(s<3600)return Math.round(s/60)+'m';
  return Math.round(s/3600)+'h';
}
function isStale(ts){
  return !ts||(Date.now()-new Date(ts).getTime())>14*60*1000;
}
function timeInPos(openedAt){
  if(!openedAt)return'';
  const s=Date.now()/1000-openedAt;
  if(s<3600)return Math.round(s/60)+'m';
  if(s<86400)return(s/3600).toFixed(1)+'h';
  return Math.round(s/86400)+'d';
}
function regimeCls(regime){
  if(!regime||regime==='—')return'rb-none';
  const r=regime.toLowerCase();
  if(r.includes('bull'))return'rb-bull';
  if(r.includes('bear'))return'rb-bear';
  if(r.includes('rang'))return'rb-range';
  if(r.includes('vol'))return'rb-vol';
  return'rb-none';
}

const COIN_COLORS={
  BTC:'#F7931A',ETH:'#627EEA',XRP:'#346AA9',ADA:'#0033AD',SOL:'#9945FF',
  BNB:'#F3BA2F',DOGE:'#C2A633',AVAX:'#E84142',DOT:'#E6007A',LINK:'#2A5ADA',

const CSRF=(document.querySelector('meta[name=csrf-token]')||{}).content||'';
function hdrs(x){
  const h=Object.assign({'X-CSRF-Token':CSRF},x||{});
  const t=localStorage.getItem('minisim_token');if(t)h['X-Auth-Token']=t;return h;
}
async function api(url,o){
  o=o||{};o.headers=hdrs(o.headers);
  let r=await fetch(url,o);
  if(r.status===401){
    const t=prompt('Token:');
    if(t){localStorage.setItem('minisim_token',t);o.headers=hdrs(o.headers);r=await fetch(url,o);}
  }
  return r;
}

/* ── cycle arc ── */
function drawCycleArc(cv,progress,count){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const s=24*dpr;
  cv.width=s;cv.height=s;
  const ctx=cv.getContext('2d');
  const cx=s/2,cy=s/2,r=s/2-2.5*dpr,lw=2.5*dpr;
  ctx.clearRect(0,0,s,s);
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#222c3a';ctx.lineWidth=lw;ctx.stroke();
  if(progress>0){
    ctx.beginPath();
    ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
  }
  ctx.fillStyle=progress>=1?'#3fb950':'#8b98a9';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold ${7*dpr}px sans-serif`;
  ctx.fillText(count,cx,cy);
}

/* ── equity chart ── */
function drawEquity(cv,pts){
  if(!cv||!pts||pts.length<2)return;
  const dpr=window.devicePixelRatio||1;
  const rc=cv.getBoundingClientRect();
  cv.width=Math.round(rc.width*dpr);cv.height=Math.round(rc.height*dpr);
  if(cv.height<8)return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const W=cv.width,H=cv.height;
  const PL=44*dpr,PR=6*dpr,PT=4*dpr,PB=14*dpr;
  const CW=W-PL-PR,CH=H-PT-PB;
  if(CW<4||CH<4)return;
  const vs=pts.map(p=>p.equity);
  const lo=Math.min(...vs),hi=Math.max(...vs),rng=(hi-lo)||1;
  const X=i=>PL+(i/(pts.length-1))*CW;
  const Y=v=>PT+(1-(v-lo)/rng)*CH;
  const up=vs[vs.length-1]>=vs[0];
  const col=up?'#3fb950':'#f85149';

  // start-value dotted reference line
  const startY=Y(vs[0]);
  ctx.setLineDash([3*dpr,3*dpr]);
  ctx.strokeStyle='rgba(139,152,169,.25)';ctx.lineWidth=dpr;
  ctx.beginPath();ctx.moveTo(PL,startY);ctx.lineTo(W-PR,startY);ctx.stroke();
  ctx.setLineDash([]);

  // grid + y labels
  for(let i=0;i<=3;i++){
    const y=PT+(i/3)*CH;
    ctx.strokeStyle='rgba(34,44,58,.7)';ctx.lineWidth=dpr;
    ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
    ctx.fillStyle='#8b98a9';ctx.font=`${7.5*dpr}px monospace`;
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('$'+Math.round(hi-(i/3)*rng).toLocaleString(),PL-3*dpr,y);
  }

  // area
  const g=ctx.createLinearGradient(0,PT,0,H-PB);
  g.addColorStop(0,up?'rgba(63,185,80,.2)':'rgba(248,81,73,.2)');
  g.addColorStop(1,'rgba(11,14,20,0)');
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.equity);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(X(pts.length-1),H-PB);ctx.lineTo(PL,H-PB);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();

  // line
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.equity);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=col;ctx.lineWidth=1.5*dpr;ctx.lineJoin='round';ctx.stroke();

  // end dot
  ctx.beginPath();
  ctx.arc(X(pts.length-1),Y(vs[vs.length-1]),2.5*dpr,0,Math.PI*2);
  ctx.fillStyle=col;ctx.fill();

  // time labels
  ctx.fillStyle='#8b98a9';ctx.font=`${7*dpr}px monospace`;ctx.textBaseline='bottom';
  const t0=new Date(pts[0].ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const t1=new Date(pts[pts.length-1].ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  ctx.textAlign='left';ctx.fillText(t0,PL,H);
  ctx.textAlign='right';ctx.fillText(t1,W-PR,H);
}

/* ── win/loss donut ── */
function drawDonut(cv,wins,total){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  const ctx=cv.getContext('2d'),cx=cv.width/2,cy=cv.height/2;
  const r=(Math.min(cv.width,cv.height)/2)-4*dpr,lw=6*dpr;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#222c3a';ctx.lineWidth=lw;ctx.stroke();
  if(total>0&&wins>0){
    ctx.beginPath();
    ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(wins/total)*Math.PI*2);
    ctx.strokeStyle='#3fb950';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
  }
  ctx.fillStyle='#e6edf3';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold ${10*dpr}px sans-serif`;
  ctx.fillText(total>0?Math.round(wins/total*100)+'%':'—',cx,cy-4*dpr);
  ctx.fillStyle='#8b98a9';ctx.font=`${7*dpr}px sans-serif`;
  ctx.fillText('win',cx,cy+6*dpr);
}

/* ── analyst dots ── */
function analystDots(analysts){
  const map={};(analysts||[]).forEach(a=>map[a.a]=a.v);
  return ANALYST_ORDER.map(name=>{
    const v=map[name];
    const col=v==='bullish'?'#3fb950':v==='bearish'?'#f85149':'#3a4a5c';
    const title=name.replace('_',' ')+': '+(v||'n/a');
    return `<div class="adot" style="background:${col}" title="${esc(title)}"></div>`;
  }).join('');
}

/* ── cycle progress ── */
function calcCycleProgress(decisions){
  if(!decisions||!decisions.length)return{count:0,progress:0};
  const sorted=[...decisions].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const newest=new Date(sorted[0].timestamp).getTime();
  const windowMs=11*60*1000;
  const seen=new Set();
  sorted.forEach(d=>{
    if(!seen.has(d.coin)&&(newest-new Date(d.timestamp).getTime())<=windowMs)
      seen.add(d.coin);
  });
  const count=Math.min(seen.size,15);
  return{count,progress:count/15};
}

/* ── candlestick chart ── */
function drawCandles(cv,candles){
  if(!cv||!candles||candles.length<2)return;
  const dpr=window.devicePixelRatio||1;
  const rc=cv.getBoundingClientRect();
  cv.width=Math.round(rc.width*dpr);cv.height=Math.round(rc.height*dpr);
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const W=cv.width,H=cv.height;
  const PL=54*dpr,PR=8*dpr,PT=10*dpr,PB=6*dpr;
  const CW=W-PL-PR,CH=H-PT-PB;
  const lo=Math.min(...candles.map(c=>c[2]));
  const hi=Math.max(...candles.map(c=>c[1]));
  const rng=(hi-lo)||1;
  const Y=v=>PT+(1-(v-lo)/rng)*CH;
  const n=candles.length;
  const gap=Math.max(1,Math.round(dpr*.5));
  const bw=Math.max(1,(CW-gap*(n-1))/n);

  for(let i=0;i<=4;i++){
    const y=PT+(i/4)*CH;
    ctx.strokeStyle='rgba(34,44,58,.8)';ctx.lineWidth=dpr;
    ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
    ctx.fillStyle='#8b98a9';ctx.font=`${7.5*dpr}px monospace`;
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('$'+(hi-(i/4)*rng).toLocaleString(undefined,{maximumFractionDigits:2}),PL-3*dpr,y);
  }

  candles.forEach((c,i)=>{
    const[o,h,l,cl]=c;
    const x=PL+i*(bw+gap);
    const up=cl>=o;
    const col=up?'#3fb950':'#f85149';
    ctx.strokeStyle=col;ctx.lineWidth=dpr;
    ctx.beginPath();ctx.moveTo(x+bw/2,Y(h));ctx.lineTo(x+bw/2,Y(l));ctx.stroke();
    const top=Y(Math.max(o,cl)),bot=Y(Math.min(o,cl));
    ctx.fillStyle=col;
    ctx.fillRect(x,top,bw,Math.max(bot-top,dpr));
  });
}

let _stratCache={};
function renderStratModal(data){
  _stratCache=data;
  const el=document.getElementById('stratModalBody');
  if(!el)return;
  const state=data.state||{};
  const cat=data.catalogue||{};
  const active=new Set(state.active_strategies||[]);
  const perf=state.last_perf||{};
  const dir=state.direction||'—';
  const risk=state.risk_level!=null?state.risk_level:1.0;
  const ts=state.updated_at?new Date(state.updated_at*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
  const dirCls=dir==='bull'?'bull':dir==='bear'?'bear':'neutral';
  const activeList=active.size?[...active].join(', '):'none selected';
  let html=`<div class="strat-router-hdr">
    <b class="${dirCls}">${dir.toUpperCase()}</b> market · risk <b>${risk}×</b> · updated <b>${ts}</b><br>
    Active: <b>${esc(activeList)}</b>
    ${state.reasoning?`<br><span style="font-style:italic">${esc(state.reasoning)}</span>`:''}
  </div><div class="strat-scroll">`;
  const ORDER=['trend_short','breakdown_scalp','oversold_bounce','momentum_long','dip_buy','range_scalp'];
  const names=ORDER.filter(n=>cat[n]||active.has(n));
  (names.length?names:Object.keys(cat)).forEach(name=>{
    const info=cat[name]||{};
    const on=active.has(name);
    const sp=perf[name]||{};
    const wr=sp.win_rate!=null?Math.round(sp.win_rate*100)+'%':'—';
    const pnl=sp.pnl_usd!=null?(sp.pnl_usd>=0?'+':'')+'$'+sp.pnl_usd.toFixed(2):'—';
    const side=info.side||'BOTH';
    const pnlCls=sp.pnl_usd!=null?(sp.pnl_usd>=0?'up':'dn'):'dim';
    html+=`<div class="strat-row">
      <div class="strat-active-dot ${on?'on':'off'}"></div>
      <div class="strat-info">
        <span class="strat-name">${esc(info.label||name)}</span>
        <span class="strat-badge ${side}">${side}</span>
        <div class="strat-meta">
          ${info.sl_pct!=null?`<span>SL <b>${(info.sl_pct*100).toFixed(1)}%</b></span>`:''}
          ${info.tp1_pct!=null?`<span>TP <b>${[info.tp1_pct,info.tp2_pct,info.tp3_pct].filter(Boolean).map(t=>(t*100).toFixed(0)).join('/')}%</b></span>`:''}
          ${sp.trades!=null?`<span>${sp.trades} trades · WR <b>${wr}</b> · <span class="${pnlCls}">${pnl}</span></span>`:'<span style="font-style:italic">no trades yet</span>'}
        </div>
      </div>
    </div>`;
  });
  if(!names.length&&!Object.keys(cat).length)
    html+='<div style="color:var(--dim);font-size:12px;padding:8px 0">Router not yet initialised</div>';
  html+='</div>';
  el.innerHTML=html;
}

      `<span class="chip"><b>${perf.trades||0}</b> trades</span>
       <span class="chip">avg <b class="${ac}">${fmtp(perf.avg_pnl_pct)}</b></span>
       <span class="chip">realized <b class="${pc}">${(perf.realized_usd||0)>=0?'+':''}$${fmt(perf.realized_usd)}</b></span>
       <span class="chip"><b>${s.coins_tracked||15}</b> coins</span>
       <span class="chip clickable" id="stratChip" onclick="openStratModal()" title="Strategy state">⚡ STRAT</span>`;

    /* trade log cache */
    _tradeCache=perf.recent||[];

    /* kill switch */
    killOn=!!s.kill_switch;
    const k=document.getElementById('kill');
    k.classList.toggle('on',killOn);
    k.textContent=killOn?'◉ RESUME TRADING':'◉ KILL SWITCH';

  }catch(e){
    document.getElementById('clock').textContent='offline';
  }
}

async function toggleKill(){
  await api(killOn?'/api/resume':'/api/kill',{method:'POST'});
  load();
}

/* ── trade log overlay ── */
function openTradeLog(){
  const body=document.getElementById('tradeLogBody');
  const empty=document.getElementById('tradeLogEmpty');
  empty.style.display=_tradeCache.length?'none':'block';
  body.innerHTML=_tradeCache.map(t=>{
    const side=(t.direction||'long').toUpperCase();
    const c=t.pnl_pct>=0?'up':'dn';
    const dt=t.buy_ts
      ?new Date(t.buy_ts).toLocaleDateString([],{month:'short',day:'numeric'})
       +' '+new Date(t.buy_ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
      :'—';
    return`<tr>
      <td class="dim" style="font-size:10px;white-space:nowrap">${esc(dt)}</td>
      <td><span class="tdir ${side}">${side}</span></td>
      <td><b>${esc(t.coin)}</b></td>
      <td class="dim">${fmtPrice(t.open_price)}</td>
      <td class="dim">${fmtPrice(t.close_price)}</td>
      <td class="dim">${fmt(t.qty)}</td>
      <td class="${c}" style="font-weight:700">${fmtp(t.pnl_pct)}</td></tr>`;
  }).join('');
  document.getElementById('logOverlay').classList.add('open');
}
function closeTradeLog(){
  document.getElementById('logOverlay').classList.remove('open');
}

/* ── candlestick modal ── */
async function openModal(coin){
  if(splitMode){return openDetailPanel(coin);}
  const sig=(window._lastSigs||{})[coin]||{};
  document.getElementById('overlay').classList.add('open');
  const mc=COIN_COLORS[coin]||'#58a6ff';
  document.getElementById('mCoin').innerHTML=
    `<span style="display:inline-flex;width:24px;height:24px;border-radius:50%;background:${mc};
      align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff;
      vertical-align:middle;margin-right:6px;flex-shrink:0">${esc(coin.slice(0,2))}</span>${esc(coin)}`;
  document.getElementById('mPrice').textContent='—';
  document.getElementById('mChg').textContent='';
  document.getElementById('mInterval').textContent='15m · loading…';
  document.getElementById('mBody').innerHTML='<div class="modal-loading">Loading chart…</div>';

  const analysts=sig.analysts||[];
  document.getElementById('mAnalysts').innerHTML=analysts.length
    ?analysts.map(a=>{
        const cls=a.v==='bullish'?'bull':a.v==='bearish'?'bear':'neut';
        return`<span class="av ${cls}"><b>${a.v}</b> ${a.a.replace('_',' ')} ${Math.round((a.c||0)*100)}%</span>`;
      }).join('')
    :'';

  try{
    const r=await api(`/api/candles?coin=${encodeURIComponent(coin)}&limit=60`);
    const data=await r.json();
    const cs=data.candles||[];
    if(cs.length){
      const last=cs[cs.length-1][3],first=cs[0][3];
      const chg=((last-first)/first)*100;
      document.getElementById('mPrice').textContent='$'+fmt(last);
      document.getElementById('mChg').textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';
      document.getElementById('mChg').className='modal-chg '+(chg>=0?'up':'dn');
      document.getElementById('mInterval').textContent=`${data.interval} · ${cs.length} candles`;
      document.getElementById('mBody').innerHTML='<canvas class="cchart" id="cchart"></canvas>';
      drawCandles(document.getElementById('cchart'),cs);
    }
  }catch(e){
    document.getElementById('mBody').innerHTML='<div class="modal-loading">Failed to load chart</div>';
  }
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeTradeLog();closeStratModal();}
});

const _autoOpen=new URLSearchParams(location.search).get('open');
if(location.hash==='#trades'){}
if(_autoOpen){
  load().then(()=>openModal(_autoOpen.toUpperCase()));
}else{
  load();
}
setInterval(load,5000);
</script>
</body>
</html>
